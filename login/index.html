<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>if(localStorage.getItem('ptaStudentJobHubTheme')==='dark')document.documentElement.setAttribute('data-theme','dark');</script>
    <meta name="description" content="Secure sign-in for Student Job Hub." />
    <title>Student Job Hub | Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/assets/jump-vault-logo.png" type="image/png" />
    <link rel="stylesheet" href="/styles.css?v=20260713d" />
  </head>
  <body data-page="login">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/" aria-label="Student Job Hub home">
          <img class="brand-mark" src="/assets/jump-vault-logo.png" alt="The Jump Vault" width="38" height="38" />
          <span>Student Job Hub</span>
        </a>
      </div>
    </header>

    <main>
      <div class="container auth-shell">
        <section class="auth-card" aria-labelledby="loginTitle">
          <h1 id="loginTitle">Sign In</h1>
          <p class="auth-subtext">Only approved users can manage job listings. Public visitors can still view jobs.</p>
          <form id="loginForm" class="auth-form">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" type="email" autocomplete="username" required />

            <label for="loginPassword">Password</label>
            <input id="loginPassword" type="password" autocomplete="current-password" required />

            <div id="loginCaptcha"></div>

            <button class="btn btn-primary" type="submit">Sign In</button>
          </form>
          <p class="auth-message" id="loginMessage" aria-live="polite"></p>
          <p class="auth-note">Need an account? Contact the site administrator to request access.</p>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <small>Student Job Hub | <span data-year></span></small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://js.hcaptcha.com/1/api.js" async defer></script>
    <script src="/app-config.js?v=20260713d"></script>
    <script src="/script.js?v=20260713e"></script>
  </body>
</html>
