<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>(function(){try{if(localStorage.getItem('ptaStudentJobHubTheme')==='dark')document.documentElement.setAttribute('data-theme','dark');var s=localStorage.getItem('studentJobHubSchoolTheme');document.documentElement.setAttribute('data-school',s==='uidaho'?'uidaho':'nic');}catch(e){}})();</script>
    <meta name="description" content="Review job listings sent in by employers." />
    <title>Student Job Hub | Job Requests</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/assets/jump-vault-logo.png" type="image/png" />
    <link rel="stylesheet" href="/styles.css?v=20260918a" />
  </head>
  <body data-page="review-requests">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/" aria-label="Student Job Hub home">
          <img class="brand-mark" src="/assets/jump-vault-logo.png" alt="The Jump Vault" width="38" height="38" />
          <span>Student Job Hub</span>
        </a>
        <button
          class="nav-hamburger"
          id="navHamburger"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="mainNav"
        >
          <span class="nav-hamburger-line" aria-hidden="true"></span>
          <span class="nav-hamburger-line" aria-hidden="true"></span>
          <span class="nav-hamburger-line" aria-hidden="true"></span>
        </button>
        <nav class="nav-links" id="mainNav" aria-label="Main navigation">
          <a class="nav-link" data-page="home" href="/">Home</a>
          <a class="nav-link" data-page="about" href="/about">About</a>
          <a class="nav-link" data-page="jobs" href="/jobs">Jobs</a>
          <div class="settings-menu">
            <button
              class="settings-trigger"
              type="button"
              aria-label="Open settings menu"
              aria-expanded="false"
              aria-haspopup="menu"
            >
              <span class="settings-dots" aria-hidden="true">⋮</span>
              <span class="settings-label">Settings</span>
            </button>
            <div class="settings-panel" aria-hidden="true">
              <button
                class="theme-toggle"
                id="themeToggle"
                type="button"
                aria-label="Dark Mode"
                aria-pressed="false"
              >
                Dark Mode
              </button>
              <div class="settings-submenu">
                <button
                  class="settings-submenu-trigger"
                  type="button"
                  aria-expanded="false"
                  aria-haspopup="true"
                  aria-controls="schoolThemeOptions"
                >
                  Theme
                </button>
                <div class="settings-submenu-panel" id="schoolThemeOptions" role="menu">
                  <button
                    type="button"
                    class="school-theme-option"
                    role="menuitemradio"
                    data-school="nic"
                    aria-checked="true"
                  >
                    North Idaho College
                  </button>
                  <button
                    type="button"
                    class="school-theme-option"
                    role="menuitemradio"
                    data-school="uidaho"
                    aria-checked="false"
                  >
                    University of Idaho
                  </button>
                </div>
              </div>
              <p class="settings-user hidden" id="settingsUserStatus" hidden></p>
              <button class="settings-auth-btn" id="authActionButton" type="button">Sign In</button>
              <button class="settings-link hidden" id="profileButton" type="button">User</button>
              <a class="settings-link hidden" id="reviewRequestsButton" href="/review-requests">
                Job Requests<span class="settings-link-count hidden" id="requestCountBadge"></span>
              </a>
              <a class="settings-link hidden" id="manageUsersButton" href="/admin-users">Manage Users</a>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <main>
      <div class="container admin-shell">
        <h1 class="admin-page-title">Job Requests</h1>
        <p class="admin-page-subtitle">
          Jobs that employers have sent in. Read one, then choose Publish or Decline.
        </p>
        <p class="auth-message" id="requestsMessage" aria-live="polite"></p>

        <div class="requests-toolbar" role="tablist" aria-label="Filter requests">
          <button class="requests-tab active" type="button" role="tab" aria-selected="true" data-status="pending">
            Waiting for you<span class="requests-tab-count" id="countPending">0</span>
          </button>
          <button class="requests-tab" type="button" role="tab" aria-selected="false" data-status="approved">
            Published<span class="requests-tab-count" id="countApproved">0</span>
          </button>
          <button class="requests-tab" type="button" role="tab" aria-selected="false" data-status="rejected">
            Declined<span class="requests-tab-count" id="countRejected">0</span>
          </button>
          <button class="btn btn-muted btn-sm requests-refresh" id="refreshRequestsBtn" type="button">Refresh</button>
        </div>

        <p class="requests-empty" id="requestsEmpty">Loading...</p>
        <div class="requests-list" id="requestsList"></div>
      </div>
    </main>

    <!-- Publish confirmation: staff pick which Job Type tab it lands under,
         because the employer form deliberately does not ask them. -->
    <div class="modal" id="publishModal" aria-modal="true" aria-labelledby="publishModalTitle" aria-hidden="true">
      <div class="modal-overlay" data-close-publish></div>
      <div class="modal-card modal-card-sm">
        <div class="modal-top">
          <h3 id="publishModalTitle">Publish this job</h3>
          <button class="close-btn" type="button" data-close-publish aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <p class="publish-modal-role" id="publishModalRole"></p>
          <form id="publishForm" class="auth-form">
            <label for="publishCategory">Which Job Type should it appear under?<span class="required-mark" aria-hidden="true">*</span></label>
            <select id="publishCategory" required></select>

            <label class="publish-sponsor-row">
              <input type="checkbox" id="publishSponsored" />
              <span>
                <strong>Feature this at the top of the list</strong>
                <span class="publish-sponsor-hint" id="publishSponsorHint">
                  Only tick this once the employer has paid for featured placement.
                </span>
              </span>
            </label>

            <div class="form-actions">
              <button class="btn btn-muted" type="button" data-close-publish>Cancel</button>
              <button class="btn btn-primary" type="submit" id="confirmPublishBtn">Publish it</button>
            </div>
          </form>
          <p class="auth-message" id="publishMessage" aria-live="polite"></p>
        </div>
      </div>
    </div>

    <!-- Decline confirmation -->
    <div class="modal" id="declineModal" aria-modal="true" aria-labelledby="declineModalTitle" aria-hidden="true">
      <div class="modal-overlay" data-close-decline></div>
      <div class="modal-card modal-card-sm">
        <div class="modal-top">
          <h3 id="declineModalTitle">Decline this job</h3>
          <button class="close-btn" type="button" data-close-decline aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <p class="publish-modal-role" id="declineModalRole"></p>
          <form id="declineForm" class="auth-form">
            <label for="declineNote">Why are you declining? <span class="wizard-optional">(optional)</span></label>
            <p class="admin-panel-hint">
              This is only a note for you and other staff. The employer does not see it.
            </p>
            <textarea id="declineNote" rows="3"></textarea>
            <div class="form-actions">
              <button class="btn btn-muted" type="button" data-close-decline>Cancel</button>
              <button class="btn btn-danger" type="submit" id="confirmDeclineBtn">Decline it</button>
            </div>
          </form>
          <p class="auth-message" id="declineMessage" aria-live="polite"></p>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="container">
        <small>Student Job Hub | <span data-year></span></small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/location-data.js?v=20260918a"></script>
    <script src="/app-config.js?v=20260918a"></script>
    <script src="/script.js?v=20260918a"></script>
  </body>
</html>
