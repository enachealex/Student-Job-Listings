<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Admin-only user management for PTA Student Job Hub." />
    <title>PTA Student Job Hub | Manage Users</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=20260531" />
  </head>
  <body data-page="admin-users">
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/" aria-label="PTA Student Job Hub home">
          <span class="brand-mark">PT</span>
          <span>PTA Student Job Hub</span>
        </a>
        <nav class="nav-links" aria-label="Main navigation">
          <a class="nav-link" href="/jobs">Jobs</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="container admin-shell">
        <h1 class="admin-page-title">Manage Users</h1>
        <p class="admin-page-subtitle">Create users and manage access permissions.</p>
        <p class="auth-message error" id="adminUserMessage" aria-live="polite"></p>

        <div class="admin-users-layout">
          <!-- Left: user list -->
          <section class="admin-panel" aria-labelledby="userListTitle">
            <div class="admin-panel-head">
              <h2 id="userListTitle">Users</h2>
              <button class="btn btn-muted btn-sm" id="refreshUsersBtn" type="button">Refresh</button>
            </div>
            <ul class="user-list" id="userList" aria-label="User list">
              <li class="user-list-empty" id="userListEmpty">Loading users...</li>
            </ul>
          </section>

          <!-- Right: create user form -->
          <section class="admin-panel" aria-labelledby="createUserTitle">
            <div class="admin-panel-head">
              <h2 id="createUserTitle">Add User</h2>
            </div>
            <p class="admin-panel-hint">New users must change their password on first sign-in.</p>
            <form id="createUserForm" class="auth-form">
              <label for="newUserEmail">Email</label>
              <input id="newUserEmail" type="email" autocomplete="off" required />

              <label for="temporaryPassword">Temporary Password</label>
              <input id="temporaryPassword" type="text" placeholder="At least 8 characters" autocomplete="off" required />

              <button class="btn btn-primary" type="submit" id="createUserBtn">Create User</button>
            </form>
            <p class="auth-message" id="createUserMessage" aria-live="polite"></p>
          </section>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <small>PTA Student Job Hub | <span data-year></span></small>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/app-config.js?v=20260531"></script>
    <script src="/script.js?v=20260531"></script>
  </body>
</html>
